/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}


</style>
</head>

#lay{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:6px;z-index:30;pointer-events:auto}
#lay button{font:700 12.5px 'Inter',sans-serif;border:1px solid #b6c6d0;background:rgba(255,255,255,.94);color:#14303c;border-radius:999px;padding:6px 13px;cursor:pointer;box-shadow:0 2px 8px rgba(30,60,80,.12)}
#lay button:hover{background:#fff;border-color:#0b8f8c}#lay button.off{background:#14303c;color:#fff;border-color:#14303c}
#left,#right{transition:transform .38s cubic-bezier(.3,.7,.2,1),opacity .3s}
#left.hide{transform:translateX(-118%);opacity:0;pointer-events:none}#right.hide{transform:translateX(118%);opacity:0;pointer-events:none}
#labels.hide{display:none}

#lesson{position:absolute;left:410px;width:780px;bottom:18px;background:rgba(255,255,255,.97);border:1px solid #b6c6d0;border-radius:8px;box-shadow:0 8px 28px rgba(30,60,80,.18);pointer-events:auto;font-family:'Inter','JetBrains Mono',sans-serif;color:#14303c;overflow:hidden}

#lesson .lh b{font:800 13px 'JetBrains Mono',monospace;letter-spacing:1px}
#lesson .dots{display:flex;gap:5px;flex:1}
#lesson .dots i{width:20px;height:7px;border-radius:4px;background:rgba(255,255,255,.28)}
#lesson .dots i.d{background:#4cd3a3}#lesson .dots i.c{background:#fff}
#lesson .lh span{font:600 12px 'JetBrains Mono',monospace;opacity:.85}
#lesson .lb{padding:10px 14px 12px}
#lesson.min .lb{display:none}
#lesson h3{margin:0 0 3px;font:800 16px 'Inter',sans-serif}
#lesson p{margin:3px 0;font:500 14px/1.5 'Inter',sans-serif}
#lesson .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
#lesson button{font:700 13px 'Inter',sans-serif;border:1px solid #b6c6d0;background:#fff;border-radius:5px;padding:7px 12px;cursor:pointer;color:#14303c}
#lesson button.go{background:#0b8f8c;border-color:#0b8f8c;color:#fff}
#lesson button.opt{display:block;width:100%;text-align:left;margin:4px 0;font-weight:600}
#lesson button.opt.ok{background:#e3f6ee;border-color:#2d7d3a}#lesson button.opt.no{background:#fdeaea;border-color:#c0392b}
#lesson input{font:700 15px 'JetBrains Mono',monospace;width:110px;padding:6px 8px;border:2px solid #0b8f8c;border-radius:5px}
#lesson .fb{padding:7px 10px;border-radius:5px;margin-top:7px;font:600 13.5px/1.5 'Inter',sans-serif}
#lesson .fb.ok{background:#e3f6ee;color:#1f6a30}#lesson .fb.no{background:#fff3e0;color:#9a4a00}#lesson .fb.hint{background:#eef3f6;color:#14303c}
#lesson .wait{font:600 13px 'JetBrains Mono',monospace;color:#e8590c}

html,body{margin:0;background:#e9eff3;overflow:hidden;height:100%}
#app{position:absolute;left:0;top:0;width:${ic}px;height:${sc}px;transform-origin:0 0;color:${Ui};font-family:'JetBrains Mono','Inter',ui-monospace,monospace;font-variant-ligatures:none;-webkit-font-smoothing:antialiased;overflow:hidden}

#ui{position:absolute;left:0;top:0;width:${ic}px;height:${sc}px;pointer-events:none}

.panel{position:absolute;top:78px;width:372px;bottom:22px;background:rgba(248,251,253,.93);border:1px solid #b6c6d0;border-radius:6px;padding:14px 16px;overflow:hidden;pointer-events:auto;box-shadow:0 8px 28px rgba(30,60,80,.12)}

.chip{position:absolute;right:20px;top:24px;display:flex;gap:10px;pointer-events:none}
.chip b{font:700 12px 'JetBrains Mono',monospace;letter-spacing:1.2px;padding:7px 12px;border:1px solid #b6c6d0;background:rgba(248,251,253,.93);border-radius:4px}

.ptitle{font:700 12.5px 'JetBrains Mono',monospace;letter-spacing:1.4px;color:#4d6573;border-bottom:1px solid #c9d6de;padding-bottom:7px;margin-bottom:9px;display:flex;justify-content:space-between}
.blk{border-left:4px solid var(--c);padding:3px 0 3px 10px;margin-bottom:9px}
.blk .bt{font:700 12px 'JetBrains Mono',monospace;color:var(--c);letter-spacing:1px;margin-bottom:3px;display:flex;justify-content:space-between}
.g{display:grid;grid-template-columns:62px 92px 1fr;align-items:center;gap:8px;height:27px}
.g .k{font:600 13px 'JetBrains Mono',monospace;color:#4d6573}
.g .v{font:700 20px 'JetBrains Mono',monospace;text-align:right;color:${Ui};white-space:nowrap}
.g .v small{font:500 11px 'JetBrains Mono',monospace;color:#6a8190;margin-left:3px}
.bg{height:9px;background:#dbe5eb;border-radius:2px;position:relative;overflow:hidden}
.bg i{position:absolute;left:0;top:0;bottom:0;background:var(--c);width:0}
.bg.spark{height:22px;background:none;overflow:visible}
.bg svg{width:100%;height:22px;display:block}
.net{margin:2px 0 10px;padding:7px 10px;border:1px solid #c9d6de;border-radius:4px;background:#fff}
.net .nr{display:flex;justify-content:space-between;align-items:baseline;font:600 12.5px 'JetBrains Mono',monospace;color:#4d6573}
.net .nr b{font:800 19px 'JetBrains Mono',monospace;color:${Ui}}
.dv{position:relative;height:12px;background:#dbe5eb;border-radius:2px;margin:6px 0 4px}
.dv i{position:absolute;top:0;bottom:0}
.dv u{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:${Ui}}
.net .st{font:700 12.5px 'Inter','JetBrains Mono',sans-serif;margin-top:3px}
.ma{border:1px solid #c9d6de;border-radius:4px;background:#fff;padding:7px 10px;margin-bottom:9px}
.ma .t{font:700 12px 'JetBrains Mono',monospace;color:#4d6573;letter-spacing:.8px}
.ma .n{display:flex;justify-content:space-between;font:700 18px 'JetBrains Mono',monospace;margin:3px 0}
.ma .tag{font:700 13px 'Inter',sans-serif;padding:5px 8px;border-radius:3px;background:#edf3f6;color:#4d6573}
.ma .tag.win{background:${$f};color:#fff}
.wave{display:flex;gap:10px;align-items:stretch}
.dial{width:112px;flex:none}
.wave .col{flex:1;min-width:0}
.rd{display:flex;justify-content:space-between;font:600 12px 'JetBrains Mono',monospace;color:#4d6573;margin-bottom:2px}
.rd b{font:800 17px 'JetBrains Mono',monospace}
svg text{font-family:'JetBrains Mono',monospace}
.sl{margin-bottom:9px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;font:700 13px 'JetBrains Mono',monospace}
.sl .top span{color:#4d6573;font-weight:600;font-size:12px}
.sl .top b{font:800 18px 'JetBrains Mono',monospace;color:var(--c)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:#cfdbe2;border-radius:3px}
input[type=range]::-moz-range-track{height:6px;background:#cfdbe2;border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);margin-top:-7px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--c);border:3px solid #fff}
.pre{display:block;width:100%;text-align:left;border:1px solid #b6c6d0;background:#fff;border-radius:4px;padding:7px 10px;margin-bottom:7px;cursor:pointer;color:${Ui};font-family:inherit}
.pre:hover{border-color:${Di}}
.pre.on{border-color:${Di};background:#e6f4f4;box-shadow:inset 4px 0 0 ${Di}}
.pre b{display:block;font:800 14px 'Inter',sans-serif}
.pre span{font:500 11.5px 'JetBrains Mono',monospace;color:#5a7281}
.btn{display:block;width:100%;font:800 15px 'Inter','JetBrains Mono',sans-serif;letter-spacing:.8px;border-radius:4px;cursor:pointer;margin-bottom:8px;padding:0 10px;text-align:center}
.btn.big{height:54px;border:0;background:${$f};color:#fff;font-size:17px;box-shadow:0 3px 0 #a93f08}
.btn.big small{display:block;font:600 10.5px 'JetBrains Mono',monospace;opacity:.92;letter-spacing:1.2px;margin-top:1px}
.btn.big.on{background:${Di};box-shadow:0 3px 0 #07605e}
.btn.out{height:38px;border:2px solid ${Di};background:#fff;color:${Di}}
.btn.out.on{background:${Di};color:#fff}
.btn.out i{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:7px}
.btn.out.on i{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.views{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.views button{height:34px;border:1px solid #b6c6d0;background:#fff;border-radius:4px;font:700 11px 'JetBrains Mono',monospace;color:${Ui};cursor:pointer;line-height:1.1}
.views button.on{background:${Ui};color:#fff;border-color:${Ui}}
.small{font:500 11px 'JetBrains Mono',monospace;color:#6a8190;line-height:1.35}
#labels{position:absolute;left:0;top:0;width:${ic}px;height:${sc}px;pointer-events:none}
#leaders{position:absolute;left:0;top:0;width:${ic}px;height:${sc}px}
.lab{position:absolute;white-space:nowrap;font:700 15px 'JetBrains Mono',monospace;padding:3px 8px;border-radius:3px;background:rgba(255,255,255,.92);border:1.5px solid var(--c);color:var(--c);transform:translate(-50%,-50%)}
.lab small{display:block;font:500 11px 'Inter',sans-serif;color:#4d6573}
.lab.part{border-style:dashed;color:${Ui}}
.turn{position:fixed;left:0;right:0;bottom:12px;text-align:center;font:600 12px 'JetBrains Mono',monospace;color:#6a8190;display:none}
@media (orientation:portrait) and (max-width:820px){.turn{display:block}}

.res{border:1px solid #c9d6de;border-radius:4px;background:#fff;padding:7px 10px;margin:2px 0 9px;font:600 13px 'JetBrains Mono',monospace;line-height:1.75}
.res b{font-weight:800}.res .ok{color:#2d7d3a}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;height:34px;border:1px solid #b6c6d0;background:#fff;border-radius:4px;font:800 13px 'Inter',sans-serif;cursor:pointer;color:${qf}}
